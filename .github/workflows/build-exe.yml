name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Smoke import
        run: python -c "from camwin.app import main; from camwin.crypto import decrypt_reload_payload; print('ok')"

      - name: Build onedir exe
        run: python -m PyInstaller --noconfirm --clean CamWin.spec

      - name: List dist
        run: |
          Get-ChildItem -Recurse dist | Select-Object FullName, Length | Format-Table -AutoSize
          if (-not (Test-Path dist\CamWin\CamWin.exe)) { throw "CamWin.exe missing" }

      - name: Zip folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist\CamWin\* -DestinationPath CamWin-windows.zip -Force
          Get-Item CamWin-windows.zip | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamWin-windows
          path: CamWin-windows.zip
          retention-days: 30

      - name: Release on tag/main
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: CamWin 1.0.3
          files: CamWin-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
